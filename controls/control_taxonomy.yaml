domains:

  cloud_security:

    storage_security:
      description: Controls governing cloud storage services such as S3, Blob storage, and object storage.
      controls:
        - GRC-001
        - GRC-002

    encryption_controls:
      description: Controls ensuring sensitive data is encrypted in storage and transit.

    logging_monitoring:
      description: Controls requiring logging, monitoring, and event notification.

    resilience_recovery:
      description: Controls supporting recovery, versioning, replication, and lifecycle management.

    network_security:
      description: Controls governing exposure of services to public networks.

    identity_access:
      description: Controls governing authentication, authorization, and privilege management.




control_family:
  id: AWS-S3-BASELINE
 # name: S3 Baseline Security Controls

controls:

  - id: GRC-001
    name: Public S3 Buckets Prohibited
    severity: HIGH
    frameworks:
      ISO27001: A.8.20
      SOC2: CC6
      NIST: AC-3
    enforcement:
      checkov: CKV_AWS_20
      opa_policy: policies/s3_public.rego

  - id: GRC-002
    name: S3 Versioning Required
    severity: MEDIUM
    frameworks:
      ISO27001: A.8.13
      SOC2: CC7
      NIST: CP-10
    enforcement:
      checkov: CKV_AWS_21
      opa_policy: policies/s3_versioning.rego
