name: Compliance Scan

on:
  push:
    branches:
      - main

jobs:
  compliance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install checkov pyyaml

      - name: Run Checkov JSON scan
        run: |
          checkov -d terraform --output json > checkov_results.json || true

      - name: Run compliance and risk evaluation engine
        run: |
          python3 evaluate_controls.py

      - name: Generate dashboard
        run: |
          python3 generate_dashboard.py

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: compliance-artifacts
          path: |
            evidence/week3_risk_report.txt
            evidence/dashboard.html
