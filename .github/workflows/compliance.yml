name: GRC Compliance and Risk Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  compliance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Checkov JSON scan
        run: |
          checkov -d . --framework terraform,github_actions --output json > checkov_results.json || true

      - name: Run compliance and risk engine
        run: |
          set +e
          python3 grc_engine.py
          engine_status=$?
          set -e
          if [ "$engine_status" -ne 0 ]; then
            if [ -f evidence/week3_risk_report.txt ] && grep -q "Decision: BLOCK DEPLOYMENT" evidence/week3_risk_report.txt; then
              echo "::warning title=Governance decision blocks deployment::The lab intentionally returned a non-zero status because the release decision is BLOCK DEPLOYMENT. Continuing so evidence and Pages can be published."
            else
              exit "$engine_status"
            fi
          fi

      - name: Generate dashboard
        if: always()
        run: |
          python3 generate_dashboard.py

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compliance-artifacts
          path: |
            evidence/week3_risk_report.txt
            evidence/dashboard.html

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-pages:
    if: always() && github.ref == 'refs/heads/main'
    needs: compliance
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
